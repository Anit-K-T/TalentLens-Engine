{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TalentLens{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            TalentLens Engine
        </a>

        <div class="text-white">
            <i class="fa-solid fa-user"></i>
            Recruiter
        </div>

    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 col-lg-2 bg-dark text-white vh-100 p-3">

            <ul class="nav flex-column">

                <li class="nav-item mb-2">
                    <a class="nav-link text-white active-menu" href="{% url 'home' %}">
                        🏠 Dashboard
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="#">
                        👥 Candidates
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="{% url 'job_list' %}">
                        💼 Job Roles
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="#">
                        🎤 Interviews
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">
                        📊 Reports
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>
</div>

<!-- Footer -->
<footer class="text-center mt-5 mb-3 text-muted">
    TalentLens Engine © 2026 | AI Recruitment Platform
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
